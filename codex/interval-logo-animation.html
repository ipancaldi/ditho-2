<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interval Logo Animation</title>
  <style>
    :root {
      --bg: #000000;
      --fg: #f3f3f3;
      --muted: rgba(243, 243, 243, 0.32);
      --duration: 3s;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out-quad: cubic-bezier(0.45, 0, 0.55, 1);
      --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
    }

    .logo {
      width: min(76vw, 760px);
      height: auto;
      overflow: visible;
    }

    .mark {
      fill: var(--fg);
      transform-box: view-box;
      shape-rendering: geometricPrecision;
    }

    .letter-path {
      fill: var(--fg);
      shape-rendering: geometricPrecision;
    }

    .bracket-base {
      transform-box: view-box;
      transform-origin: 50% 92%;
      animation: bracketBase var(--duration) var(--ease-in-out-quad) both;
    }

    .bracket-left {
      animation: bracketLeft var(--duration) var(--ease-in-out-quad) both;
    }

    .bracket-right {
      animation: bracketRight var(--duration) var(--ease-in-out-quad) both;
    }

    .logo-i,
    .logo-l {
      transform-box: view-box;
      opacity: 0;
      animation: letterBounce var(--duration) var(--ease) both;
    }

    .logo-i {
      transform-origin: 2.768px 26.182px;
    }

    .logo-l {
      transform-origin: 123.679px 26.182px;
    }

    .word {
      animation: textFade var(--duration) linear both;
    }

    .controls {
      position: fixed;
      right: 18px;
      bottom: 18px;
      display: flex;
      gap: 8px;
    }

    button {
      min-height: 36px;
      border: 1px solid rgba(243, 243, 243, 0.22);
      border-radius: 8px;
      background: rgba(243, 243, 243, 0.08);
      color: var(--fg);
      padding: 8px 12px;
      font: 650 13px/1 var(--font);
      cursor: pointer;
    }

    button:hover {
      border-color: rgba(243, 243, 243, 0.54);
      background: rgba(243, 243, 243, 0.14);
    }

    .timeline {
      position: fixed;
      left: 18px;
      bottom: 24px;
      width: min(360px, calc(100vw - 36px));
      height: 2px;
      background: rgba(243, 243, 243, 0.16);
    }

    .timeline::before {
      content: "";
      display: block;
      height: 100%;
      width: 100%;
      background: var(--fg);
      transform-origin: left center;
      animation: progress var(--duration) linear both;
    }

    @keyframes bracketBase {
      0%,
      16.6667% {
        transform: scaleX(0);
      }
      27.5% {
        transform: scaleX(1.022);
      }
      31.25% {
        transform: scaleX(0.997);
      }
      33.3333%,
      100% {
        transform: scaleX(1);
      }
    }

    @keyframes bracketLeft {
      0%,
      16.6667% {
        transform: translateX(47.606%);
      }
      27.5% {
        transform: translateX(-1.05%);
      }
      31.25% {
        transform: translateX(0.14%);
      }
      33.3333%,
      100% {
        transform: translateX(0);
      }
    }

    @keyframes bracketRight {
      0%,
      16.6667% {
        transform: translateX(-47.606%);
      }
      27.5% {
        transform: translateX(1.05%);
      }
      31.25% {
        transform: translateX(-0.14%);
      }
      33.3333%,
      100% {
        transform: translateX(0);
      }
    }

    @keyframes letterBounce {
      0%,
      33.3333% {
        opacity: 0;
        transform: translateY(61.8%);
      }
      33.4% {
        opacity: 1;
        transform: translateY(61.8%);
      }
      47% {
        opacity: 1;
        transform: translateY(-6%);
      }
      54% {
        opacity: 1;
        transform: translateY(2.5%);
      }
      61% {
        opacity: 1;
        transform: translateY(-1%);
      }
      66.6667%,
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes textFade {
      0%,
      66.6667% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    @keyframes progress {
      from {
        transform: scaleX(0);
      }
      to {
        transform: scaleX(1);
      }
    }

    .paused * {
      animation-play-state: paused !important;
    }

    @media (max-width: 720px) {
      .logo {
        width: 88vw;
      }

      .controls {
        right: 12px;
        bottom: 12px;
      }

      .timeline {
        left: 12px;
        bottom: 18px;
        width: calc(100vw - 136px);
      }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="Interval logo storyboard animation">

    </svg>

    <div class="timeline" aria-hidden="true"></div>
    <div class="controls" aria-label="Animation controls">
      <button type="button" id="replay">Replay</button>
      <button type="button" id="pause">Pause</button>
    </div>
  </main>

  <script>
    const stage = document.getElementById("stage");
    const replay = document.getElementById("replay");
    const pause = document.getElementById("pause");

    replay.addEventListener("click", () => {
      stage.classList.remove("paused");
      pause.textContent = "Pause";
      document.getAnimations().forEach((animation) => {
        animation.cancel();
        animation.play();
      });
    });

    pause.addEventListener("click", () => {
      stage.classList.toggle("paused");
      pause.textContent = stage.classList.contains("paused") ? "Play" : "Pause";
    });
  </script>
</body>
</html>
